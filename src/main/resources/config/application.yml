# MySQL con
#  figuration

spring:

  datasource:
    url: jdbc:mysql://localhost
    username:
    password:
    driver-class-name:
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
     ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show-sql: true
        use_sql_comments: true
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis


logging:
  level:
    org:
      hibernate:
            SQL: DEBUG
            type:
              descriptor:
                sql:
                  BasicBinder: TRACE



server:
    port: 8081
  
  # Scheduled jobs
commission:
  job:
   cron:  0 30 9 * * *
summary:
  job:
    cron:  0 30 9 * * *
logs:
  job:
    cron: 0 30 9 * * *